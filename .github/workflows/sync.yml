name: Google Photos to Koofr Sync

on:
  schedule:
    # Chạy tự động lúc 02:00 sáng hàng ngày (giờ UTC)
    - cron: '0 2 * * *'
  workflow_dispatch:
    # Cho phép bấm nút chạy thủ công từ giao diện GitHub
    inputs:
      dry_run:
        description: 'Chạy thử nghiệm (Dry Run)?'
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install & Configure Rclone
        env:
          KOOFR_USER: ${{ secrets.KOOFR_USER }}
          KOOFR_PASS: ${{ secrets.KOOFR_PASS }}
        run: |
          sudo apt-get update && sudo apt-get install -y rclone
          mkdir -p ~/.config/rclone
          
          # Mật khẩu Koofr app password được rclone obfuscate hoặc truyền trực tiếp qua config WebDAV
          cat <<EOF > ~/.config/rclone/rclone.conf
          [koofr_remote]
          type = webdav
          url = https://app.koofr.net/dav/Koofr
          vendor = other
          user = $KOOFR_USER
          pass = $(rclone obscure "$KOOFR_PASS")
          EOF

      - name: Run Sync Engine
        run: |
          # Kiểm tra nếu chạy thủ công với cờ dry_run
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            python -m src.main
          else
            python -m src.main --dry-run
          fi
