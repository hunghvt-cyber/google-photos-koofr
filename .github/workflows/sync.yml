name: Google Photos to Koofr Sync

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Chạy thử nghiệm (Dry Run)?'
        type: boolean
        default: true

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install & Configure Rclone
        env:
          KOOFR_USER: ${{ secrets.KOOFR_USER }}
          KOOFR_PASS: ${{ secrets.KOOFR_PASS }}
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt-get update -y
          sudo apt-get install -y rclone
          mkdir -p ~/.config/rclone
          
          cat <<EOF > ~/.config/rclone/rclone.conf
          [koofr_remote]
          type = webdav
          url = https://app.koofr.net/dav/Koofr
          vendor = other
          user = $KOOFR_USER
          pass = $(rclone obscure "$KOOFR_PASS")
          EOF

      # Kéo file state đã lưu từ cache (nếu có)
      - name: Restore State Cache
        uses: actions/cache/restore@v4
        with:
          path: data/koofr_state.json
          key: koofr-state-${{ github.run_id }}
          restore-keys: |
            koofr-state-

      - name: Run Sync Engine
        run: |
          if [ "${{ inputs.dry_run }}" = "false" ]; then
            python -m src.main
          else
            python -m src.main --dry-run
          fi

      # Lưu lại file state mới vào cache cho lần chạy kế tiếp
      - name: Save State Cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/koofr_state.json
          key: koofr-state-${{ github.run_id }}
